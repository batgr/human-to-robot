<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 560" width="1320" height="560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <pattern id="tiles" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#e2e8f0"/>
      <rect width="6" height="6" fill="#cbd5e1"/>
      <rect x="6" y="6" width="6" height="6" fill="#cbd5e1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1320" height="560" rx="16" fill="#ffffff"/>

  <!-- ============ Panel 1: training ============ -->
  <rect x="16" y="16" width="660" height="528" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="36" y="50" font-size="18" font-weight="700" fill="#0f172a">1 · Training on human video, no action labels</text>

  <!-- frames -->
  <rect x="40" y="100" width="74" height="74" rx="6" fill="url(#tiles)" stroke="#94a3b8"/>
  <text x="77" y="194" font-size="13" fill="#334155" text-anchor="middle">frame t</text>
  <rect x="40" y="330" width="74" height="74" rx="6" fill="url(#tiles)" stroke="#94a3b8"/>
  <text x="77" y="424" font-size="13" fill="#334155" text-anchor="middle">frame t+1</text>

  <!-- encoder -->
  <rect x="150" y="190" width="120" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="210" y="238" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">Encoder</text>
  <text x="210" y="258" font-size="12.5" fill="#1e3a8a" text-anchor="middle">ViT-tiny</text>
  <text x="210" y="275" font-size="12.5" fill="#1e3a8a" text-anchor="middle">from scratch</text>
  <text x="210" y="292" font-size="11" fill="#1e40af" text-anchor="middle" font-style="italic">shared weights</text>
  <path d="M114,137 C135,137 130,222 148,222" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M114,367 C135,367 130,278 148,278" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- states -->
  <rect x="300" y="120" width="70" height="34" rx="17" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="335" y="142" font-size="15" fill="#0f172a" text-anchor="middle" font-style="italic">s<tspan font-size="11" dy="4">t</tspan></text>
  <rect x="300" y="346" width="70" height="34" rx="17" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="335" y="368" font-size="15" fill="#0f172a" text-anchor="middle" font-style="italic">s<tspan font-size="11" dy="4">t+1</tspan></text>
  <path d="M270,222 C288,222 282,137 298,137" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M270,278 C288,278 282,363 298,363" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- predictor -->
  <rect x="420" y="96" width="140" height="82" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="490" y="128" font-size="16" font-weight="700" fill="#14532d" text-anchor="middle">Predictor</text>
  <text x="490" y="148" font-size="12.5" fill="#14532d" text-anchor="middle">6 causal blocks</text>
  <text x="490" y="165" font-size="12.5" fill="#14532d" text-anchor="middle">AdaLN-zero on z<tspan font-size="9.5" dy="3">t</tspan></text>
  <path d="M370,137 L418,137" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- IDM -->
  <rect x="420" y="246" width="140" height="74" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="490" y="276" font-size="16" font-weight="700" fill="#7c2d12" text-anchor="middle">IDM</text>
  <text x="490" y="296" font-size="12.5" fill="#7c2d12" text-anchor="middle">latent action from</text>
  <text x="490" y="312" font-size="12.5" fill="#7c2d12" text-anchor="middle">two consecutive states</text>
  <path d="M352,154 C352,230 390,268 418,268" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M370,363 C395,363 398,300 418,300" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- z -->
  <path d="M490,246 L490,180" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="500" y="219" font-size="15" fill="#7c2d12" font-style="italic">z<tspan font-size="11" dy="4">t</tspan></text>

  <!-- prediction -->
  <rect x="590" y="120" width="70" height="34" rx="17" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="625" y="142" font-size="15" fill="#0f172a" text-anchor="middle" font-style="italic">ŝ<tspan font-size="11" dy="4">t+1</tspan></text>
  <path d="M560,137 L588,137" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- loss -->
  <rect x="580" y="338" width="80" height="50" rx="10" fill="#ffffff" stroke="#64748b" stroke-dasharray="5 4" stroke-width="1.5"/>
  <text x="620" y="360" font-size="14" font-weight="700" fill="#334155" text-anchor="middle">MSE</text>
  <text x="620" y="377" font-size="11.5" fill="#334155" text-anchor="middle">prediction</text>
  <path d="M625,154 L625,336" fill="none" stroke="#64748b" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M370,375 C470,395 520,370 578,366" fill="none" stroke="#64748b" stroke-dasharray="5 4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- notes -->
  <text x="36" y="470" font-size="13.5" fill="#0f172a">Loss = MSE(ŝ<tspan font-size="10" dy="3">t+1</tspan><tspan dy="-3">, s</tspan><tspan font-size="10" dy="3">t+1</tspan><tspan dy="-3">) + β · KL(z</tspan><tspan font-size="10" dy="3">t</tspan><tspan dy="-3">) + λ · SIGReg(states)</tspan></text>
  <text x="36" y="494" font-size="13" fill="#475569">Something-Something v2, 20–200 h at 4 fps; the predictor also reads past states.</text>
  <text x="36" y="516" font-size="13" fill="#475569">Trained end to end. Current models add a 2-step rollout loss from step 1050.</text>

  <!-- ============ Panel 2: planning ============ -->
  <rect x="692" y="16" width="612" height="528" rx="14" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="712" y="50" font-size="18" font-weight="700" fill="#0f172a">2 · Planning on the robot, world model frozen</text>

  <!-- images -->
  <rect x="716" y="100" width="74" height="74" rx="6" fill="url(#tiles)" stroke="#94a3b8"/>
  <text x="753" y="194" font-size="13" fill="#334155" text-anchor="middle">current image</text>
  <rect x="716" y="330" width="74" height="74" rx="6" fill="url(#tiles)" stroke="#94a3b8"/>
  <text x="753" y="424" font-size="13" fill="#334155" text-anchor="middle">goal image</text>

  <!-- encoder -->
  <rect x="826" y="190" width="110" height="120" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="881" y="246" font-size="16" font-weight="700" fill="#1e3a8a" text-anchor="middle">Encoder</text>
  <text x="881" y="266" font-size="12.5" fill="#1e3a8a" text-anchor="middle">frozen</text>
  <path d="M790,137 C810,137 806,222 824,222" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M790,367 C810,367 806,278 824,278" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- states -->
  <rect x="962" y="120" width="70" height="34" rx="17" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="997" y="142" font-size="15" fill="#0f172a" text-anchor="middle" font-style="italic">s<tspan font-size="11" dy="4">t</tspan></text>
  <rect x="962" y="346" width="70" height="34" rx="17" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="997" y="368" font-size="15" fill="#0f172a" text-anchor="middle" font-style="italic">s<tspan font-size="11" dy="4">goal</tspan></text>
  <path d="M936,222 C952,222 946,137 960,137" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M936,278 C952,278 946,363 960,363" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- CEM -->
  <rect x="1100" y="66" width="170" height="54" rx="12" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="1185" y="90" font-size="16" font-weight="700" fill="#581c87" text-anchor="middle">CEM planner</text>
  <text x="1185" y="108" font-size="12.5" fill="#581c87" text-anchor="middle">samples action sequences</text>

  <!-- controller -->
  <rect x="1100" y="158" width="170" height="54" rx="12" fill="#fae8ff" stroke="#c026d3" stroke-width="1.5"/>
  <text x="1185" y="182" font-size="16" font-weight="700" fill="#701a75" text-anchor="middle">Controller</text>
  <text x="1185" y="200" font-size="12.5" fill="#701a75" text-anchor="middle">robot action → z</text>
  <path d="M1185,120 L1185,156" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1194" y="143" font-size="12.5" fill="#334155" font-style="italic">a<tspan font-size="9.5" dy="3">t</tspan><tspan dy="-3"> … a</tspan><tspan font-size="9.5" dy="3">t+H−1</tspan></text>

  <!-- predictor -->
  <rect x="1100" y="250" width="170" height="54" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1185" y="274" font-size="16" font-weight="700" fill="#14532d" text-anchor="middle">Predictor</text>
  <text x="1185" y="292" font-size="12.5" fill="#14532d" text-anchor="middle">rolls out H steps</text>
  <path d="M1185,212 L1185,248" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1194" y="235" font-size="14" fill="#7c2d12" font-style="italic">z</text>

  <!-- s_t bus to controller and predictor -->
  <path d="M1032,137 L1066,137 L1066,277 L1098,277" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M1066,185 L1098,185" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- cost -->
  <rect x="1100" y="340" width="170" height="54" rx="12" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
  <text x="1185" y="364" font-size="16" font-weight="700" fill="#334155" text-anchor="middle">Cost</text>
  <text x="1185" y="383" font-size="13" fill="#334155" text-anchor="middle" font-style="italic">‖ŝ<tspan font-size="9.5" dy="3">t+H</tspan><tspan dy="-3"> − s</tspan><tspan font-size="9.5" dy="3">goal</tspan><tspan dy="-3">‖</tspan></text>
  <path d="M1185,304 L1185,338" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M1032,363 L1098,363" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- feedback to CEM -->
  <path d="M1270,367 L1290,367 L1290,93 L1272,93" fill="none" stroke="#9333ea" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="1282" y="236" font-size="12" fill="#581c87" text-anchor="middle" transform="rotate(-90 1282 236)">keep the best, resample</text>

  <!-- execute -->
  <rect x="716" y="448" width="564" height="56" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="998" y="472" font-size="14.5" font-weight="700" fill="#0f172a" text-anchor="middle">Robot (robosuite Panda) executes the first action</text>
  <text x="998" y="492" font-size="12.5" fill="#475569" text-anchor="middle">new image → replan at every step (closed loop, MPC)</text>
  <path d="M1185,394 L1185,446" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="1194" y="424" font-size="12" fill="#334155">best plan</text>
  <path d="M716,476 L704,476 L704,137 L714,137" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
</svg>
