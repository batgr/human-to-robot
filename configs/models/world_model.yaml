embed_dim: &D 128

encoder: configs/models/encoders/vit_tiny.yaml   # or dinov2_small.yaml (frozen)

projector:   # MLP on the encoder's CLS token, input_dim: the encoder dim
  hidden_dim: 512
  output_dim: *D

predictor:
  input_dim: *D
  hidden_dim: *D
  depth: 6
  heads: 4
  dim_head: 32
  mlp_dim: 512
  dropout: 0.1
  emb_dropout: 0.0

pred_proj:
  input_dim: *D
  hidden_dim: 512
  output_dim: *D

idm:
  dim: *D
  depth: 2
  heads: 4
