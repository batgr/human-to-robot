# robosuite episodes: h2r data collect writes raw_dir, then h2r data extract and push as for any video folder.

raw_dir: data/h2r-sim/raw/        # <robot>/<task>/<policy>/episode_<seed>/: <camera>.mp4, state.parquet, sim.parquet;
processed_dir: data/h2r-sim/      # inside processed_dir, so that push and download carry the simulator states too

# collect
robots: [Panda]                   # robosuite arms, same seeds for each (e.g. [Panda, Sawyer]); UR5e and Jaco need
                                  # another gripper reading in RobosuiteEnv.robot_state
collect: [Lift]                   # tasks collected, among those below (e.g. [Lift, PickPlaceCan])
tasks:                            # task -> object observation and workspace (world frame) for the policies
  Lift:
    object: cube_pos
    low: [-0.15, -0.15, 0.83]
    high: [0.10, 0.15, 0.95]
    noise: 0.1                    # scripted: max std of the autoregressive command noise, drawn per episode
    gain: 2.0                     # scripted: command = gain x the one covering the remaining distance in one step
    max_hold: 12                  # scripted: steps before moving to the next waypoint anyway
  PickPlaceCan:
    object: Can_pos
    low: [-0.05, -0.40, 0.88]
    high: [0.22, -0.05, 1.02]
    noise: 0.1
    gain: 2.0
    max_hold: 12
policies: [scripted, random]      # random: varied actions for the IDM and the controller (scripted ones are correlated)
episodes: 1100                    # per robot, task and policy; episode k uses seed k. Train ~1540 (as the controller
                                  # ablation of 2026-10-14), test ~220 scripted
steps: 40                         # actions per episode (steps + 1 frames)
frameskip: 5                      # control steps per action: 20 Hz / 5 = 4 actions per second
cameras: [agentview]              # one video per camera, e.g. [agentview, frontview] (cameras of every task)
video_crf: 12                     # H.264 quality (lower = closer to lossless)

env:
  has_renderer: false
  has_offscreen_renderer: true
  use_camera_obs: false           # images rendered by RobosuiteEnv once per kept frame, not at every control step
  camera_heights: 224
  camera_widths: 224
  control_freq: 20
  horizon: 100000

# extract
fps: 4                            # = control_freq / frameskip: keeps every frame
image_size: 224
min_frames: 5
actions: true                     # from state.parquet: end-effector deltas, as for DROID
split_by: folder                  # the cameras of an episode stay in the same split

split:
  val: 0.1
  test: 0.2
  seed: 0

shard_size: 250
hf_repo: batgre/h2r-sim-v3      # v2: 500 scripted episodes, test 0.35 (A/C protocol); h2r-sim: older format
private: false
