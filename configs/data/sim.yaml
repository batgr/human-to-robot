processed_dir: data/h2r-sim/

tasks:
  Lift:
    object: cube_pos
    low: [-0.15, -0.15, 0.83]
    high: [0.10, 0.15, 0.95]
  PickPlaceCan:
    object: Can_pos
    low: [-0.05, -0.40, 0.88]
    high: [0.22, -0.05, 1.02]
policies: [scripted, random]
episodes: 500
steps: 40
frameskip: 5

env:
  robots: Panda
  has_renderer: false
  has_offscreen_renderer: true
  use_camera_obs: true
  camera_names: agentview
  camera_heights: 224
  camera_widths: 224
  control_freq: 20
  horizon: 100000

split:
  val: 0.1
  test: 0.1
  seed: 0

shard_size: 250
hf_repo: batgre/h2r-sim
private: false
