# Offline planning evaluation (Δxyz): plan from t towards t + H on clips of test episodes with actions.
name: plan-offline
seed: 0
controller: outputs/controller/<run>   # trained controller run; its world_model entry gives the world model
output_dir: outputs

data:
  root: data/h2r-sim/                  # episode shards with actions (h2r data extract, actions: true)
  split: test
clips: 64                              # random (episode, t), as Garrido et al.

planner:
  context: 3                           # real frames given to the predictor (1: protocol of Garrido et al.)
  past_latents: controller             # latent actions of the context: controller on the recorded actions, or idm
  window: 3                            # frames the predictor sees while unrolling (its training context)
  horizon: 3                           # H
  samples: 300                         # N
  elites: 10                           # K
  iterations: 15                       # J
  searched: [0, 1, 2, 6]               # Δxyz and gripper; rotations stay at 0
  max_norm: null                       # optional bound on the translation norm (physical units)
  pick: best                           # best sequence (Garrido et al.) or mean (Terver et al.)
