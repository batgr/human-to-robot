# Closed-loop planning in robosuite on test episodes of h2r data collect (model predictive control).
name: plan-robosuite
seed: 0
controller: outputs/controller/<run>   # trained controller run; its world_model entry gives the world model
sim_config: configs/data/sim.yaml      # raw_dir, env, frameskip and split of the collected episodes
output_dir: outputs

task: Lift
policy: scripted                       # episodes whose start states and goals are used
split: test
camera: agentview
episodes: 20
goal_offset: 10                        # goal = frame t0 + G of the same episode (2.5 s at 4 Hz)
steps: 15                              # actions executed, replanning after each one (m = 1)

planner:
  context: 3
  past_latents: controller             # measured actions of the robot, translated by the controller (or idm)
  window: 3
  horizon: 3
  samples: 300
  elites: 10
  iterations: 15
  searched: [0, 1, 2, 6]
  max_norm: null
  pick: best
