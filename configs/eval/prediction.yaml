# Does the world model predict the robot's future? (h2r eval prediction), on held-out simulated test episodes.
# Runs go to output_dir/name/prediction.
name: prediction
seed: 0
controller: outputs/ctrl-phone-h2     # trained controller run; its world_model entry gives the world model
sim_config: configs/data/sim.yaml      # raw_dir, fps, image size and split of the collected episodes
output_dir: outputs

robot: Panda
task: Lift
episodes_from: scripted                # collected policy whose test episodes are used
camera: agentview
episodes: 10                           # first test episodes
context: 3                             # real frames given to the predictor
horizon: 2                             # predicted steps
stride: 2                              # one start every stride frames
