# Human-to-robot transfer from h2r eval pick runs (h2r eval transfer). A: robot only, B: SSv2 then robot videos,
# C: SSv2 frozen. Every run must have been evaluated on the same test initial states.
name: transfer
output_dir: outputs
arms: [A, C]
budgets: [10, 50]                      # robot episodes
seeds: [0]                             # training seeds
pick_runs: pick-{arm}-{n}-s{seed}      # h2r eval pick run of each (arm, budget, seed), in output_dir
policy: planner
reference: A                           # the arm without human video
bootstrap: 10000
compute:                               # reported as is, next to the robot data
  A: 5000 iterations on the n robot episodes
  B: 5000 SSv2 + 5000 fine-tuning iterations
  C: 5000 SSv2 iterations
