# Pick success in closed loop on held-out test episodes (h2r eval pick): the central measure.
name: pick
seed: 0
policies: [random, replay, planner]    # names in h2r.eval.pick.POLICIES, all run on the same initial states
controller: outputs/controller        # planner only: trained controller run; its world_model entry gives the world model
sim_config: configs/data/sim.yaml      # raw_dir, env, frameskip and split of the collected episodes
output_dir: outputs

robot: Panda
task: Lift
episodes_from: scripted                # collected policy whose test episodes give the initial states and goals
camera: agentview
episodes: 50                           # test episodes where the object was lifted; paired across arms. Final
                                       # results: 100 (Wilson 95% about ±10 points)
start: 2                               # t0: frame the simulator is reset to (earlier frames: planner context)
goal: lift                             # frame where the object is highest (offset: frame t0 + goal_offset)
goal_offset: 10
subgoals: true                         # also the pre-grasp and grasp frames: the lift is ~30 steps away, beyond H
steps: 38                              # commands per episode: a collected episode after t0
filmstrip: planner                     # policy whose first success and first failure are drawn (null: none)
render: false                          # true: watch the episodes in a window

planner:
  context: 3                           # real frames given to the predictor
  past_latents: controller             # measured actions translated by the controller, or idm
  window: 3                            # frames the predictor sees while unrolling
  horizon: 5                           # H = rollout_steps.end of the world model
  samples: 300                         # N
  elites: 10                           # K
  iterations: 10                       # J (LeWM; Garrido et al.: 15)
  searched: [0, 1, 2, 6]               # Δxyz and gripper; rotations stay at 0
  max_norm: null                       # optional bound on the translation norm (physical units)
  pick: best                           # best sequence (Garrido et al.) or mean (Terver et al.)
