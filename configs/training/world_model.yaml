name: wm-test
seed: 0
model: configs/models/world_model.yaml
data: configs/data/config.yaml
output_dir: outputs
precision: bf16
batch_size: 128
num_workers: 4
overfit_batches: 0 # > 0: train and validate on these first batches only

loss:
  beta: 0.001
  sigreg: 0.09

iterations: 1000
log_every: 25

optim:
  lr: 0.00005 # AdamW, LeWM (batch 128)
  weight_decay: 0.001
  warmup: 0.1
  grad_clip: 1.0

wandb:
  enabled: false
  project: h2r

eval_every: 250

resume: null
