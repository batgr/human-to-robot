name: wm-test
seed: 0
model: configs/models/world_model.yaml
data: configs/data/config.yaml
output_dir: outputs
precision: bf16
context: 3
rollout_steps: 2
batch_size: 128
num_workers: 4

loss:
  beta: 0.001
  sigreg: 0.09

iterations: 1000
log_every: 25

optim:
  muon_lr: 0.02
  adamw_lr: 0.00022
  weight_decay: 0.04
  warmup: 0.1
  grad_clip: 1.0

wandb:
  enabled: false
  project: h2r

eval_every: 250
