name: wm-test
seed: 0
model: configs/models/world_model.yaml
data: configs/data/config.yaml
output_dir: outputs
precision: bf16
batch_size: 128
num_workers: 4
overfit_batches: 0 # > 0: train and validate on these first batches only

loss:
  beta: 0.0001 # 1e-3 starved z (diagnostics E3): tf/pers 0.75 -> 0.40, z carries motion, not the next frame
  sigreg: 0.09
  prediction: mse # tf and the rollout terms: mse (LeWM, Terver et al.) or l1 (Garrido et al. 2026, on a frozen encoder); mean over the dimensions, so beta and sigreg weigh differently with l1
  rollout_steps: 1 # K, k-step loss of JEPA-WM: tf + L_2 + ... + L_K (their best: 2, last-gradient only); 1 = teacher forcing only (diagnostics E8: K = 2 makes z leak the next frame, 1 % -> 66 %)
  rollout_from: 0 # first step of the k-step loss, teacher forcing only before (diagnostics E9: K = 2 from step 500, leak 66 % -> 3 %)
  stop_grad_target: false # true: no gradient of the prediction loss through the target states (AD-E2E-JEPA); LeWM and every run so far: none
  rollout_window: 3 # W_t: states the predictor sees in the rollout steps k > 1 (Terver et al. 2025: 3); W_t < clip_len

iterations: 1000
log_every: 25

optim:
  lr: 0.0001 # AdamW at batch 128 (LeWM: 5e-5); every diagnostics run E1-E12 used 1e-4
  weight_decay: 0.001
  warmup: 0.1
  grad_clip: 1.0

wandb:
  enabled: false
  project: h2r

eval_every: 250
save_every: 0 # > 0: also step-N.pt every save_every steps, to probe the run over training afterwards

probe: # HandProbe at each validation (h2r.metrics.probe), SSv2 validation videos only
  hands: null # parquet of video, x, y per frame (tracked hand, NaN where none; where.ipynb); null = no probe
  frames: 3000 # validation frames with a hand, for the position probe
  videos: 1000 # whole validation videos for MotionProbe (h2r.metrics.probe: what z and the states know of the motion, SSv2 classes from labels.parquet when there); 0 = no probe
best_metric: prediction/tf_over_persistence # best.pt = its lowest validation value. Not loss/total_val: SIGReg weighs
  # as much as tf in it, and tf alone falls when the encoder erases the motion; the ratio rewards a leak (watch latent_action/leak)

resume: null
