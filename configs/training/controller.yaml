name: ctrl
seed: 0
model: configs/models/controller.yaml
world_model: null # run of the world model, frozen: the controller belongs to it
checkpoint: best.pt # of that run
output_dir: outputs
precision: bf16

data:
  root: data/h2r-droid/ # or a list, with hf_repo: one controller on the episodes of all of them
  hf_repo: batgre/h2r-droid # DROID (Garrido et al. 2026), 10 h of the left exterior camera at 4 fps (configs/data/droid.yaml); sim: batgre/h2r-sim-v3, root data/h2r-sim/
  test_root: null # datasets of the test metrics, test_<folder>/; null = root
  cache: data/cache # states and latent actions, encoded once per world model run and split

horizon: 7 # open-loop steps of the rollout metrics, as the world model's (clips of 8 frames)
iterations: 3000 # Garrido et al. 2026, appendix A
batch_size: 256
log_every: 100
eval_every: 500

optim: # Garrido et al. 2026, appendix A
  lr: 0.001
  weight_decay: 0.04
  warmup: 0.1 # 300 of the 3000 iterations

wandb:
  enabled: false
  project: h2r
