name: ctrl
seed: 0
model: configs/models/controller.yaml
world_model: null # run of the world model (config.yaml + best.pt), frozen: the controller belongs to it
output_dir: outputs
precision: bf16

data:
  root: data/h2r-sim/
  hf_repo: batgre/h2r-sim-v3 # Panda Lift, 40 actions per episode at 4 Hz (the world model's 4 fps), scripted and random
  cache: data/cache # states and latent actions, encoded once per world model run and split

horizon: 7 # open-loop steps of the rollout metrics, as the world model's (clips of 8 frames)
planning: # offline planning to a goal frame on the test episodes, CEM of Garrido et al. 2026 (appendix A)
  episodes: 128 # test episodes, one clip each (Garrido et al.: 64)
  horizon: 3 # actions planned, the goal is the frame after them
  samples: 300
  elites: 10
  iterations: 15
iterations: 4000
batch_size: 256
log_every: 100
eval_every: 500

optim: # Garrido et al. 2026, appendix A
  lr: 0.001
  weight_decay: 0.04
  warmup: 0.075 # 300 of the 4000 iterations

wandb:
  enabled: false
  project: h2r
