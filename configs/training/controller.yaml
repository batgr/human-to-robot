name: controller
seed: 0
model: configs/models/controller.yaml
world_model: outputs/h2r       # trained world model run (config.yaml + best.pt); the controller belongs to it
output_dir: outputs

data:
  root: data/h2r-sim/            # episode shards with actions (h2r data collect, then extract)
  hf_repo: batgre/h2r-sim-v3
  cache: data/cache              # states and IDM targets, encoded once per world model and split
  include: ["Panda/Lift/*"]      # fnmatch patterns on video paths; null: every episode
  max_videos: null               # data budget: at most this many training episodes (see data.dataset.select)
  seed: 0                        # draws the budget's episodes, as for the world model trained on the same budget
init_from: null                  # controller run to start from (few-shot transfer, e.g. Panda -> Sawyer)

# Garrido et al. 2026, appendix A
optim:
  lr: 0.001
  weight_decay: 0.04
  warmup: 300                    # iterations
iterations: 3000
batch_size: 256
eval_every: 250
precision: bf16

wandb:
  enabled: true
  project: h2r
