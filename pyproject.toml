[project]
name = "human-to-robot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "einops>=0.8.2",
    "huggingface-hub>=2.2.0",
    "matplotlib>=3.11.2",
    "mujoco==3.2.7",
    "numpy>=2.5.3",
    "pillow>=12.3.0",
    "pyarrow>=26.0.0",
    "pyyaml>=6.0.3",
    "robosuite>=1.5.1",
    "scipy>=1.18.1",
    "torch>=2.14.1",
    "transformers>=5.19.0",
    "wandb>=0.30.0",
]

[project.scripts]
h2r = "h2r.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "h2r"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
